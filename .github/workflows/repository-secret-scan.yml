name: Repository Secret Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  repository-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          echo "GITLEAKS_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test secret exception validator
        run: python3 -m unittest tools/test_check_gitleaks_exceptions.py
      - name: Scan tracked tree and candidate history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          snapshot_dir="$RUNNER_TEMP/gitleaks-tree"
          current_report="$RUNNER_TEMP/gitleaks-current.json"
          delta_report="$RUNNER_TEMP/gitleaks-delta.json"
          mkdir -p "$snapshot_dir" secret-scan-evidence
          git archive --format=tar HEAD | tar -xf - -C "$snapshot_dir"

          gitleaks dir \
            --no-banner \
            --exit-code 0 \
            --timeout 300 \
            --max-target-megabytes 25 \
            --report-format json \
            --report-path "$current_report" \
            "$snapshot_dir"
          test -f "$current_report" || printf '[]\n' > "$current_report"

          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            range="${PR_BASE_SHA}..HEAD"
          elif [ "$EVENT_NAME" = "push" ] &&
               [ -n "$PUSH_BEFORE_SHA" ] &&
               [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE_SHA}..HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            range="HEAD^..HEAD"
          fi

          if [ -n "$range" ]; then
            gitleaks git \
              --no-banner \
              --exit-code 0 \
              --timeout 300 \
              --report-format json \
              --report-path "$delta_report" \
              --log-opts="$range" \
              .
          fi
          test -f "$delta_report" || printf '[]\n' > "$delta_report"
      - name: Enforce narrow, expiring secret exceptions
        run: |
          python3 tools/check_gitleaks_exceptions.py \
            --report "$RUNNER_TEMP/gitleaks-current.json" \
            --delta-report "$RUNNER_TEMP/gitleaks-delta.json" \
            --exceptions .github/gitleaks-exceptions.yml \
            --root "$RUNNER_TEMP/gitleaks-tree" \
            --evidence secret-scan-evidence/results.txt \
            --commit "$(git rev-parse HEAD)" \
            --scanner-version "$GITLEAKS_VERSION"
      - name: Upload repository secret scan evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: repository-secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: secret-scan-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Remove raw secret reports
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gitleaks-current.json" "$RUNNER_TEMP/gitleaks-delta.json"
