global
    log stdout format raw local0
    maxconn 32

defaults
    log global
    mode tcp
    option tcplog
    option logasap
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend postgres_public
    bind 82.22.63.61:15432
    bind 0.0.0.0:25432
    acl allowed_monitor_source src 141.145.222.86/32 115.191.46.23/32
    tcp-request inspect-delay 2s
    tcp-request content reject if !allowed_monitor_source
    default_backend postgres_local

backend postgres_local
    server postgres 127.0.0.1:15433 check inter 5s fall 3 rise 2
