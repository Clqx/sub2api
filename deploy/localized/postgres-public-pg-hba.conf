# Local container traffic keeps the existing SCRAM authentication behavior.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# The public gateway forwards TLS without terminating it. The dedicated
# external role is rejected when a client does not negotiate PostgreSQL TLS.
hostssl   sub2api_loc   sub2api_external_monitor_ro   0.0.0.0/0   scram-sha-256
hostssl   sub2api_loc   sub2api_external_monitor_ro   ::0/0        scram-sha-256
hostnossl sub2api_loc   sub2api_external_monitor_ro   0.0.0.0/0   reject
hostnossl sub2api_loc   sub2api_external_monitor_ro   ::0/0        reject

host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::0/0                    scram-sha-256
